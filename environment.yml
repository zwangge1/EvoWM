name: evowm
channels: [conda-forge]
dependencies:
  - python=3.11
  - pip
  - pip:
      # PyPI 上的 torch 2.7.1（Linux）默认就是 CUDA 12.6 版本，不需要额外的 PyTorch 源；国内可用镜像加速
      - torch==2.7.1
      - torchvision==0.22.1
      # 以下对应 hjepa/pyproject.toml 的 dependencies 与 train 两组（去掉视频与机器人环境）
      - numpy
      - scipy
      - pandas
      - openpyxl
      - einops
      - loguru
      - tabulate
      - tqdm
      - typer
      - rich
      - h5py
      - hdf5plugin
      - gdown
      - gymnasium==1.2.3
      - transformers>=4.50.0
      - stable-pretraining==0.1.7
      - datasets>=4
      - lightning>=2.5
      - torchmetrics
      - hydra-core
      - hydra-submitit-launcher
      - wandb
      - scikit-learn
      - matplotlib
      - psutil
      # 工程验证的落震仿真（src/evowm/engineering/drop.py）；版本固定，接触求解的行为随版本变
      - exudyn==1.13.6
